name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: preppilot_test
          POSTGRES_USER: preppilot
          POSTGRES_PASSWORD: preppilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preppilot -d preppilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://preppilot:preppilot@localhost:5432/preppilot_test
      DATABASE_SSL: "false"
      # Test-only secrets - not used anywhere else.
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-0123456789abcdef
      ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      AI_MOCK: "true"
      RUN_WORKER: "false"
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: "1"
      # Used by the web build for the /api/v1 rewrite target.
      API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs `tsc --noEmit` in every workspace that defines it:
      # @preppilot/shared, @preppilot/api, @preppilot/web and @preppilot/mobile.
      - name: Typecheck (all workspaces incl. mobile)
        run: npm run typecheck

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build API
        run: npm run build:api
        env:
          NODE_ENV: production

      - name: Build web
        run: npm run build:web
        env:
          NODE_ENV: production
